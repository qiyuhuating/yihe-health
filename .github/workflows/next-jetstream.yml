name: Yihe-Next JetStream experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/jetstream/**'
      - 'backend/**'
      - '.github/workflows/next-jetstream.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/jetstream/**'
      - 'backend/**'
      - '.github/workflows/next-jetstream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify isolated JetStream experiment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: yihe_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_root_only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_MYSQL_DSN: root:ci_root_only@tcp(localhost:3306)/yihe_test
      TEST_S3_ENDPOINT: 127.0.0.1:19000
      TEST_S3_ACCESS_KEY: yihe-ci-test-only
      TEST_S3_SECRET_KEY: yihe-ci-disposable-secret-only
    defaults:
      run:
        working-directory: experiments/jetstream
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            experiments/jetstream/go.sum
            backend/go.sum
      - name: Start isolated RustFS 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yihe-rustfs"
          mkdir -p "$dir/volume"
          curl --fail --location --retry 3 --output "$dir/rustfs.zip" https://github.com/rustfs/rustfs/releases/download/1.0.7/rustfs-linux-x86_64-musl-v1.0.7.zip
          echo "c90a40ba8cdc1468c71029a4d65fdd13449720183d3a8e00bc61ab09fcd448a5  $dir/rustfs.zip" | sha256sum --check
          unzip -q "$dir/rustfs.zip" -d "$dir"
          chmod +x "$dir/rustfs"
          RUSTFS_ACCESS_KEY="$TEST_S3_ACCESS_KEY" RUSTFS_SECRET_KEY="$TEST_S3_SECRET_KEY" RUSTFS_CONSOLE_ENABLE=false RUSTFS_OBS_LOG_DIRECTORY="$dir/logs" "$dir/rustfs" server --address "$TEST_S3_ENDPOINT" --console-address 127.0.0.1:19001 "$dir/volume" >"$dir/server.log" 2>&1 &
          echo "$!" > "$dir/pid"
          for attempt in $(seq 1 60); do
            kill -0 "$(cat "$dir/pid")"
            if (echo > /dev/tcp/127.0.0.1/19000) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: go mod verify
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race -count=1 -v -timeout 180s ./...
      - name: Stop isolated RustFS
        if: always()
        shell: bash
        run: |
          pid="$RUNNER_TEMP/yihe-rustfs/pid"
          if [ -f "$pid" ]; then kill "$(cat "$pid")" 2>/dev/null || true; fi
