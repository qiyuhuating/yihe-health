# CI-only credentials; do not share these ephemeral services with production.
name: MySQL migration verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/p0-db-migration.yml
      - deploy/Dockerfile
      - backend/cmd/migrate/**
      - backend/migrations/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: yihe_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pci_root_only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the release image
        env:
          IMAGE: yihe-migration-ci:${{ github.sha }}
        run: docker build --file deploy/Dockerfile --tag "$IMAGE" .
      - name: Run the packaged migrator and prove the second execution is a no-op
        env:
          IMAGE: yihe-migration-ci:${{ github.sha }}
          MYSQL_DSN: root:ci_root_only@tcp(host.docker.internal:3306)/yihe_test
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/app/yihe"]'
          migrate() {
            docker run --rm --add-host=host.docker.internal:host-gateway \
              --entrypoint /app/migrate --env MYSQL_DSN="$MYSQL_DSN" "$IMAGE"
          }
          migrate
          dump() {
            docker exec "${{ job.services.mysql.id }}" mysqldump \
              -u root -pci_root_only --single-transaction --skip-comments \
              --skip-dump-date --no-tablespaces --set-gtid-purged=OFF \
              --routines --triggers yihe_test
          }
          dump > "$RUNNER_TEMP/migration-first.sql"
          migrate
          dump > "$RUNNER_TEMP/migration-second.sql"
          diff -u "$RUNNER_TEMP/migration-first.sql" "$RUNNER_TEMP/migration-second.sql"
