name: Security

on:
  push:
    branches: [preview, main]
  pull_request:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Security change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql_go: ${{ steps.classify.outputs.codeql_go }}
      codeql_js: ${{ steps.classify.outputs.codeql_js }}
      codeql_matrix: ${{ steps.classify.outputs.codeql_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/reliability/pr_change_scope.py >> "$GITHUB_OUTPUT"

  codeql:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.codeql_go == 'true' || needs.change-scope.outputs.codeql_js == 'true' }}
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.change-scope.outputs.codeql_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact analysis source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > "$RUNNER_TEMP/codeql-source.txt"
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build Go for analysis
        if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}}/codeql-sarif
      - name: Preserve exact-source findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-${{ matrix.language }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}}/codeql-sarif
            ${{ runner.temp }}}/codeql-source.txt
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Security gate / required
    needs: [change-scope, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce selected CodeQL checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          CODEQL_GO: ${{ needs.change-scope.outputs.codeql_go }}
          CODEQL_JS: ${{ needs.change-scope.outputs.codeql_js }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$CODEQL_GO" = true ] || [ "$CODEQL_JS" = true ]; then
            test "$CODEQL_RESULT" = success
          else
            test "$CODEQL_RESULT" = skipped
          fi
