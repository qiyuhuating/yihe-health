[package]
name = "yihe-next-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-std", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
yihe-core = { path = "../../yihe-core" }

[profile.release]
lto = "thin"
codegen-units = 1
