[package]
name = "yihe-next-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-std", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
yihe-core = { path = "../../yihe-core" }
yihe-device-wire = { path = "../device-wire" }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "mysql-rsa", "chrono", "tls-none"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
hex = "0.4.3"
subtle = "2.6.1"
async-nats = { version = "=0.53.0", default-features = false, features = ["jetstream", "ring", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
aes-gcm = "0.10.3"
getrandom = "0.4"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
