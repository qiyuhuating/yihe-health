<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="样式/reconstruction.css"><link rel="stylesheet" href="样式/ui-polish.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; base-uri 'none'; object-src 'none'; form-action 'self'">
  <meta name="description" content="颐和社区健康居民登录，查看授权的健康记录与照护任务。">
  <title>登录 · 颐和智慧康养</title>
  <script src="脚本/theme.js" defer></script><script src="脚本/care-runtime-config.js" defer></script><script src="脚本/care-transport.js" defer></script><script src="脚本/care-session.js" defer></script><script src="脚本/care-mode-ui.js" defer></script>
</head>
<body>
  <noscript>请启用 JavaScript 后使用健康平台。</noscript>
<a class="skip-link" href="#loginForm">跳到登录表单</a>
  <header class="login-header">
    <a class="login-brand" href="home.html"><span class="login-seal" aria-hidden="true">颐</span><span>颐和 · 智慧康养<small>从容度日 · 安心相伴</small></span></a>
    <a class="login-back" href="home.html">返回机构官网 <span aria-hidden="true">↗</span></a>
  </header>

  <main class="login-layout">
    <section class="login-story" aria-labelledby="loginStoryTitle">
      <p class="login-eyebrow">YIHE · WELLNESS</p>
      <h1 id="loginStoryTitle">每天的健康，<br><em>有人牵挂。</em></h1>
      <p class="login-story-copy">查看今日健康、用药档案与本地提醒。用清楚的文字和熟悉的步骤，陪您安心度过每一天。</p>
      <div class="login-story-mark" aria-hidden="true"><span>安</span><span>康</span><span>有</span><span>序</span></div>
      <p class="login-story-foot" data-demo-only>前端演示 · 指标、位置和预警均为模拟，未接入设备或通知服务。</p>
    </section>

    <section class="login-card-cn" aria-labelledby="cardTitle">
      <p class="login-card-kicker">居民端 / 登录</p>
      <h2 id="cardTitle">欢迎回来</h2>
      <p class="login-card-copy" data-http-text="请输入您的账号，查看个人健康记录。">请输入演示账号，继续查看您的健康主页。</p>
      <form id="loginForm" autocomplete="on">
        <div class="login-form-inner">
          <label for="loginName" data-http-text="账号">姓名</label>
          <input class="login-input-cn" type="text" id="loginName" name="username" placeholder="请输入账号或姓名" autocomplete="username" required>
          <label for="loginPassword">密码</label>
          <input class="login-input-cn" type="password" id="loginPassword" name="password" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="submit" class="login-btn-cn" id="loginSubmit"><span data-login-label>进入康养平台</span> <span aria-hidden="true">→</span></button>
          <p class="login-hint" id="loginHint" role="alert" hidden></p>
        </div>
      </form>
      <p class="login-card-note" data-http-text="请保管好账号信息，使用公共设备后及时退出。">体验环境中的登录仅用于切换演示居民，不连接真实医疗档案。</p>
    </section>
  </main>
  <footer class="login-footer"><span>颐和 · 智慧康养</span><a href="privacy.html">隐私说明</a><a href="guide.html">使用指南</a></footer>
  <script src="数据/residents.js" defer></script>
<script src="脚本/config.js" defer></script>
<script src="脚本/demo-credentials.js" defer></script>
  <script src="脚本/login-http.js" defer></script><script src="脚本/login-page.js" defer></script>
  <script src="脚本/common.js" defer></script>
</body>
</html>
