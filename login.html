    <main class="login-card-cn">
      <div class="card-seal" aria-hidden="true">颐</div>

      <!-- 欢迎归来：加粗马善政毛笔书法 -->
      <h2 class="card-welcome">欢迎归来</h2>
      <p class="card-greeting">丙午年 · 已为您开启康养之门</p>

      <form id="loginForm" autocomplete="off">
        <div class="login-form-inner">
          <input class="login-input-cn" type="text" id="loginName" placeholder="请输入姓名" aria-label="姓名" required>
          <input class="login-input-cn" type="password" id="loginPassword" placeholder="请输入密码" aria-label="密码" required>
          <button type="submit" class="login-btn-cn" id="loginSubmit">进入康养平台</button>
          <p class="login-hint" id="loginHint" hidden></p>
        </div>
      </form>
    </main>

  </div>

  <!-- 底部八卦铭文（后天八卦序：坎一坤二震三巽四乾六兑七艮八离九） -->
